<!doctype html>
<!-- 카카오톡·네이버 공유 미리보기 그림(assets/og-image.png, 1200x630)을 만드는 원본. 브라우저로 캡처해서 씀 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Pretendard"; src: url("../assets/fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: "Pretendard", "Malgun Gothic", sans-serif; background: #fff4dc; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,246,226,.97) 0%, rgba(255,246,226,.9) 42%, rgba(255,246,226,0) 66%); }
  .text { position: absolute; left: 72px; top: 92px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo { width: 86px; height: 61px; background: url("../assets/logo-opendoor.webp") no-repeat; background-size: 221.6px auto; background-position: -69.6px -64.4px; }
  .name { font-size: 30px; font-weight: 800; color: #12402f; letter-spacing: -0.02em; }
  .sub { font-size: 20px; color: #4d5752; margin-top: 2px; }
  h1 { font-size: 64px; line-height: 1.25; letter-spacing: -0.04em; color: #12402f; margin: 48px 0 18px; }
  h1 em { font-style: normal; color: #c2502f; }
  .url { display: inline-block; font-size: 24px; font-weight: 700; color: #fff; background: #1f6b4c; padding: 10px 22px; border-radius: 999px; }
</style>
</head>
<body>
  <img class="art" src="../assets/hero.svg" alt="">
  <div class="fade"></div>
  <div class="text">
    <div class="brand"><div class="logo"></div><div><div class="name">서울시 강남구 재가노인복지기관</div><div class="sub">운영법인 사단법인 오픈도어</div></div></div>
    <h1>어르신의 하루가<br><em>더 따뜻하고 든든하도록</em></h1>
    <span class="url">www.gnjaega.or.kr</span>
  </div>
</body>
</html>
