# 홈페이지 배포: 글이 올라올 때마다 개인정보를 자동 점검하고, 통과해야만 홈페이지에 반영합니다.
# - 점검: tools/개인정보_점검.py (주민등록번호·카드번호·계좌번호·휴대전화 번호가 있으면 '고쳐야 함' → 배포 중단)
# - 배포가 중단되면 홈페이지는 바로 전 상태 그대로 유지되고, GitHub가 저장소 주인에게 실패 알림 메일을 보냅니다.
# - 해당 글을 고치거나(또는 업무관리에서 게시 내리기) 다시 올리면 자동으로 다시 점검·배포합니다.
name: 개인정보 점검 후 홈페이지 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: 개인정보 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 소식 글 개인정보 점검
        run: |
          set -o pipefail
          echo '## 개인정보 점검 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if python tools/개인정보_점검.py | tee -a "$GITHUB_STEP_SUMMARY"; then status=0; else status=$?; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::개인정보로 보이는 내용(주민등록번호·카드번호·계좌번호·휴대전화 번호)이 있어 홈페이지 배포를 멈췄습니다. 위 결과의 '고쳐야 함' 글을 고쳐 주세요."
          fi
          exit $status

  deploy:
    name: 홈페이지 배포
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
